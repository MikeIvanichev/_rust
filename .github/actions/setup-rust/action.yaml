name: Setup Rust
description: >-
  Install the pinned Rust toolchains through mise with the stable (MSRV) one as the default, initialize the cache, and optionally install cargo tools. Steps that need nightly run `cargo +"$RUST_NIGHTLY"`. A job that needs a moving channel, such as `beta`, sets `channel` and runs `cargo +beta`.
inputs:
  tools:
    description: Space-separated extra mise tools to install, such as `just taplo`.
    required: false
    default: ""
  channel:
    description: A moving Rust channel to install and update, such as `stable`, `beta` or `nightly`.
    required: false
    default: ""
  cargo-hack:
    description: Whether to install cargo-hack.
    required: false
    default: "false"
  cargo-nextest:
    description: Whether to install cargo-nextest.
    required: false
    default: "false"
  cargo-llvm-cov:
    description: Whether to install cargo-llvm-cov.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Use the CI mise environment
      shell: bash
      run: echo "MISE_ENV=ci" >> "$GITHUB_ENV"
    - name: Install Rust through mise
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        # LINT.IfChange(mise_version)
        version: "2026.11.0" # MISE_VERSION
        # LINT.ThenChange(//.github/workflows/audit.yaml:mise_version)
        install_args: rust mr-boxington ${{ inputs.channel && format('rust@{0}', inputs.channel) || '' }} ${{ inputs.tools }}
    - name: Update the Rust channel
      if: ${{ inputs.channel != '' }}
      shell: bash
      # mise install keeps a channel it has installed before; upgrade updates it.
      env:
        CHANNEL: ${{ inputs.channel }}
      run: mise upgrade "rust@${CHANNEL}"
    - name: Name the pinned toolchains
      shell: bash
      # The value is the nightly that mise reads from this repository's own
      # mise.toml, which is no less trusted than the code the job builds.
      run: | # zizmor: ignore[github-env]
        versions="$(mise ls --current --json rust | jq -r '.[].version')"
        echo "RUST_NIGHTLY=$(grep '^nightly-' <<< "${versions}")" >> "$GITHUB_ENV"
    - name: Initialize cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - name: Install cargo-hack
      if: ${{ inputs['cargo-hack'] == 'true' }}
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-hack
    - name: Install cargo-nextest
      if: ${{ inputs['cargo-nextest'] == 'true' }}
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-nextest
    - name: Install cargo-llvm-cov
      if: ${{ inputs['cargo-llvm-cov'] == 'true' }}
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-llvm-cov
