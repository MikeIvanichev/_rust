name: Setup Rust
description: Install a Rust toolchain, initialize the cache, and optionally install cargo tools.
inputs:
  components:
    description: Comma-separated Rust components to install.
    required: false
    default: ""
  cargo-hack:
    description: Whether to install cargo-hack.
    required: false
    default: "false"
  cargo-nextest:
    description: Whether to install cargo-nextest.
    required: false
    default: "false"
  cargo-llvm-cov:
    description: Whether to install cargo-llvm-cov.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      with:
        toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
        components: ${{ inputs.components }}
    - name: Initialize cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Install cargo-hack
      if: ${{ inputs['cargo-hack'] == 'true' }}
      uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
      with:
        tool: cargo-hack
    - name: Install cargo-nextest
      if: ${{ inputs['cargo-nextest'] == 'true' }}
      uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
      with:
        tool: cargo-nextest
    - name: Install cargo-llvm-cov
      if: ${{ inputs['cargo-llvm-cov'] == 'true' }}
      uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
      with:
        tool: cargo-llvm-cov
