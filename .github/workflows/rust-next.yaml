name: rust-next
permissions:
  contents: read
on:
  schedule:
    - cron: '1 1 1 * *'
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        rust: ["stable", "beta"]
        include:
          - os: ubuntu-latest
            rust: "nightly"
    continue-on-error: ${{ matrix.rust != 'stable' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          channel: ${{ matrix.rust }}
          cargo-hack: "true"
          cargo-nextest: "true"
      - name: Build
        run: cargo +${{ matrix.rust }} nextest run --workspace --no-run
      - name: Test
        run: cargo +${{ matrix.rust }} hack nextest run --each-feature --workspace --no-tests=pass
      - name: Test documentation
        run: cargo +${{ matrix.rust }} test --workspace --all-features --doc --no-fail-fast
  latest:
    name: Check latest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: $/.github/actions/setup-rust
        with:
          channel: stable
          cargo-hack: "true"
          cargo-nextest: "true"
      - name: Update dependencies
        run: cargo +stable update
      - name: Build
        run: cargo +stable nextest run --workspace --no-run
      - name: Test
        run: cargo +stable hack nextest run --each-feature --workspace --no-tests=pass
      - name: Test documentation
        run: cargo +stable test --workspace --all-features --doc --no-fail-fast
