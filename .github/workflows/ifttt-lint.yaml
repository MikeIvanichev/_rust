# Not run through pre-commit checks because they don't handle sending the correct commit
# range to `ifttt-lint`; the action validates co-changes across the PR's commits.
name: ifttt-lint
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ifttt-lint:
    name: ifttt-lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run ifttt-lint
        # LINT.IfChange(ifttt_lint_version)
        uses: simonepri/ifttt-lint@41ad27c50e223731b5f33d7cd45a215259211692 # v0.11.2
        # LINT.ThenChange(//.pre-commit-config.yaml:ifttt_lint_version)
