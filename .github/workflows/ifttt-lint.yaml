# Not run through pre-commit checks because they don't handle sending the correct commit
# range to `ifttt-lint`; the action validates co-changes across the PR's commits.
name: ifttt-lint
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ifttt-lint:
    name: ifttt-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ifttt-lint
        # LINT.IfChange(ifttt_lint_version)
        uses: simonepri/ifttt-lint@9a13181b9f5f3dc365a898ebd312f74c263309be # v0.11.0
        # LINT.ThenChange(//.pre-commit-config.yaml:ifttt_lint_version)
