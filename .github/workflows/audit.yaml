name: Audit
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  # LINT.IfChange(msrv)
  RUSTUP_TOOLCHAIN: "1.99.1"
  # LINT.ThenChange(//Cargo.toml:msrv)
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  audit:
    permissions:
      contents: none
    name: Audit
    needs: [advisories, cargo_deny, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    steps:
      - name: Failed
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
  advisories:
    name: Advisories
    permissions:
      contents: read
      issues: write
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          rust-version: ${{ env.RUSTUP_TOOLCHAIN }}
  cargo_deny:
    name: Bans, licenses, and sources
    permissions:
      contents: read
      issues: write
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
          rust-version: ${{ env.RUSTUP_TOOLCHAIN }}
  actions:
    name: Actions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Public repos get code scanning automatically. Private repos can set
          # ENABLE_CODE_SCANNING=true when GitHub code scanning is enabled.
          advanced-security: ${{ github.event.repository.visibility == 'public' || vars.ENABLE_CODE_SCANNING == 'true' }}
  jactionlint:
    name: jactionlint (trial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jactionlint
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # LINT.IfChange(mise_version)
          version: "2026.10.10" # MISE_VERSION
          # LINT.ThenChange(//.github/actions/setup-rust/action.yaml:mise_version)
          install_args: jactionlint shellcheck
      - name: Run jactionlint
        # LINT.IfChange(jactionlint_version)
        uses: jdx/jactionlint@a0bb9f012b6b5760c17c9ccd040001d08002a10e # v2.1.0
        # LINT.ThenChange(//mise.toml:jactionlint_version)
        with:
          executable: jactionlint
          online: "true"
          # Public repos get code scanning automatically. Private repos can set
          # ENABLE_CODE_SCANNING=true when GitHub code scanning is enabled.
          advanced-security: ${{ github.event.repository.visibility == 'public' || vars.ENABLE_CODE_SCANNING == 'true' }}
