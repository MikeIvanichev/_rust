name: Audit
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
  # LINT.IfChange(msrv)
  RUSTUP_TOOLCHAIN: "1.100.0"
  # LINT.ThenChange(//Cargo.toml:msrv)
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  audit:
    permissions:
      contents: none
    name: Audit
    needs: [advisories, cargo_deny, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    steps:
      - name: Failed
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
  advisories:
    name: Advisories
    permissions:
      contents: read
      issues: write
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint advisories
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories
          rust-version: ${{ env.RUSTUP_TOOLCHAIN }}
  cargo_deny:
    name: Bans, licenses, and sources
    permissions:
      contents: read
      issues: write
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint bans, licenses, and sources
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check bans licenses sources
          rust-version: ${{ env.RUSTUP_TOOLCHAIN }}
  actions:
    name: Actions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          # Public repos get code scanning automatically. Private repos can set
          # ENABLE_CODE_SCANNING=true when GitHub code scanning is enabled.
          advanced-security: ${{ github.event.repository.visibility == 'public' || vars.ENABLE_CODE_SCANNING == 'true' }}
  jactionlint:
    name: jactionlint (trial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jactionlint
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # LINT.IfChange(mise_version)
          version: "2026.11.14" # MISE_VERSION
          # LINT.ThenChange(//.github/actions/setup-rust/action.yaml:mise_version)
          install_args: jactionlint shellcheck
      - name: Run jactionlint
        # LINT.IfChange(jactionlint_version)
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        # LINT.ThenChange(//mise.toml:jactionlint_version)
        with:
          executable: jactionlint
          online: "true"
          # Public repos get code scanning automatically. Private repos can set
          # ENABLE_CODE_SCANNING=true when GitHub code scanning is enabled.
          advanced-security: ${{ github.event.repository.visibility == 'public' || vars.ENABLE_CODE_SCANNING == 'true' }}
