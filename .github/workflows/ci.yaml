name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  ci:
    permissions:
      contents: none
    name: CI
    needs: [test, msrv, lockfile, docs, formatting, clippy, minimal-versions, coverage]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: always()
    steps:
      - name: Failed
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
  test:
    name: Test
    strategy:
      matrix:
        os: ["blacksmith-2vcpu-ubuntu-2404", "blacksmith-2vcpu-windows-2025", "blacksmith-6vcpu-macos-latest"]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cargo-hack: "true"
          cargo-nextest: "true"
      - name: Build
        run: cargo nextest run --workspace --no-run
      - name: Test
        run: cargo hack nextest run --each-feature --workspace --no-tests=pass
  msrv:
    name: Check MSRV
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cargo-hack: "true"
      - name: Check declared MSRV
        run: cargo hack check --each-feature --locked --rust-version --workspace --all-targets --keep-going
  minimal-versions:
    name: Minimal versions
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Downgrade direct dependencies to minimal versions
        run: cargo +"$RUST_NIGHTLY" generate-lockfile -Z direct-minimal-versions
      - name: Compile with minimal versions
        run: cargo check --workspace --all-features --locked --keep-going
  lockfile:
    name: Lockfile
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Is lockfile updated?
        run: cargo update --workspace --locked
  docs:
    name: Docs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Check documentation
        run: cargo doc --workspace --all-features --no-deps --document-private-items --keep-going
      - name: Test documentation
        run: cargo test --profile testing --workspace --all-features --doc --no-fail-fast
  formatting:
    name: Formatting
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust and formatting tools
        uses: ./.github/actions/setup-rust
        with:
          tools: taplo yamlfmt
      - name: Check formatting
        # `rustfmt.toml` sets `unstable_features`, which only nightly rustfmt
        # honors; stable rustfmt silently drops those options.
        # LINT.IfChange(check_fmt)
        run: |
          cargo +"$RUST_NIGHTLY" fmt --all -- --check
          taplo fmt --check
          yamlfmt -lint .
        # LINT.ThenChange(//justfile:check_fmt)
  clippy:
    name: Clippy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Install clippy-sarif and sarif-fmt
        # These crates aren't in taiki-e/install-action's tool manifest, so it
        # would fall back to cargo-binstall by default — which hits
        # https://github.com/Swatinem/rust-cache/issues/204 (stale metadata).
        # Forcing the cargo-install fallback builds from source; slower on a
        # cold cache but correct, and rust-cache handles the target artifacts.
        #
        # Public repos get code scanning automatically. Private repos can set
        # ENABLE_CODE_SCANNING=true when GitHub code scanning is enabled.
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: clippy-sarif,sarif-fmt
          fallback: cargo-install
        if: github.event.repository.visibility == 'public' || vars.ENABLE_CODE_SCANNING == 'true'
      - name: Check (SARIF)
        run: >
          cargo clippy --workspace --all-features --all-targets --message-format=json | clippy-sarif | tee clippy-results.sarif | sarif-fmt

        continue-on-error: true
        if: github.event.repository.visibility == 'public' || vars.ENABLE_CODE_SCANNING == 'true'
      - name: Upload
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: clippy-results.sarif
          wait-for-processing: true
        if: github.event.repository.visibility == 'public' || vars.ENABLE_CODE_SCANNING == 'true'
      - name: Check
        run: cargo clippy --workspace --all-features --all-targets --keep-going -- --allow deprecated
  coverage:
    name: Coverage
    environment: codecov
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cargo-nextest: "true"
          cargo-llvm-cov: "true"
      - name: Inventory tests
        id: test_inventory
        run: |
          cargo nextest list --workspace --all-features --tests --message-format json > nextest-list.json
          count="$(jq -r '."test-count" // 0' nextest-list.json)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
      - name: Skip coverage
        if: steps.test_inventory.outputs.count == '0'
        run: |
          echo "No tests discovered; skipping coverage generation." >> "$GITHUB_STEP_SUMMARY"
      - name: Gather coverage
        if: steps.test_inventory.outputs.count != '0'
        run: cargo llvm-cov nextest --workspace --all-features --tests --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        if: steps.test_inventory.outputs.count != '0'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
