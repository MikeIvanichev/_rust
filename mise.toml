[tools]
# The first toolchain is the development default; mise.ci.toml makes the
# MSRV the default in CI.
rust = [
  { version = "nightly-2026-10-26", components = [
    "rustc",
    "cargo",
    "rustfmt",
    "rust-std",
    "rust-docs",
    "rust-analyzer",
    "llvm-tools-preview",
    "clippy",
    "rust-src",
  ], mr_boxington = true },
  # LINT.IfChange(msrv)
  { version = "1.99.1", components = [
    "rustc",
    "cargo",
    "rustfmt",
    "rust-std",
    "clippy",
    "llvm-tools-preview",
  ] },
  # LINT.ThenChange(//Cargo.toml:msrv)
]
mr-boxington = "1.23.0"
"cargo:cargo-deny" = { version = "0.20.2", depends = "rust" }
"cargo:cargo-hack" = { version = "0.6.45", depends = "rust" }
"cargo:cargo-llvm-cov" = { version = "0.9.1", depends = "rust" }
"cargo:cargo-nextest" = { version = "0.9.148", depends = "rust" }
"cargo:clippy-sarif" = { version = "0.8.0", depends = "rust" }
"cargo:sarif-fmt" = { version = "0.8.0", depends = "rust" }
# LINT.IfChange(committed_version)
committed = "1.1.11"
# LINT.ThenChange(
#     //.github/workflows/committed.yaml:committed_version,
#     //.pre-commit-config.yaml:committed_version,
# )
git-cliff = "2.14.2"
# LINT.IfChange(jactionlint_version)
jactionlint = "2.1.0"
# LINT.ThenChange(//.github/workflows/audit.yaml:jactionlint_version)
just = "1.58.0"
# LINT.IfChange(prek_version)
prek = "0.5.5"
# LINT.ThenChange(//.github/workflows/pre-commit.yaml:prek_version)
shellcheck = "0.11.0"
taplo = "0.10.0"
yamlfmt = "0.21.0"
