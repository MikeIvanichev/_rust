style = "conventional"
# The Conventional Commits types that cliff.toml groups: committed's default
# list lacks build, ci and revert.
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "style",
  "test",
]
ignore_author_re = "(dependabot|renovate)"
merge_commit = true
